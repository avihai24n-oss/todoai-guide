<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>חוברת הדרכה · TodoAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #111;
         font-family: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
         font-size: 17px; line-height: 1.7; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
  a { color: #111; text-underline-offset: 3px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: #f3f3f3;
         padding: 1px 6px; border-radius: 5px; direction: ltr; unicode-bidi: isolate; }
  h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.2; margin: 18px 0 12px; font-weight: 800; letter-spacing: -.01em; }
  h2 { font-size: 23px; margin: 0 0 12px; font-weight: 800; }
  h3 { font-size: 16px; margin: 0 0 6px; }
  p { margin: 0 0 14px; }
  .logo { border-radius: 50%; display: block; }
  .lead { font-size: 19px; color: #555; }
  .hero { padding-bottom: 32px; border-bottom: 1px solid #e8e8e8; }
  section { padding: 36px 0; border-bottom: 1px solid #e8e8e8; }
  section:last-child { border-bottom: 0; }
  .big-idea { background: #f7f7f5; border: 0; border-radius: 18px; padding: 28px 24px; margin-top: 32px; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 18px 0 20px; }
  .box { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 10px 14px; min-width: 120px; flex: 1; }
  .box b { display: block; font-size: 16px; }
  .box span { font-size: 13px; color: #666; }
  .box.dark { background: #111; color: #fff; border-color: #111; }
  .box.dark span { color: #bbb; }
  .plus, .arrow { font-size: 22px; color: #999; font-weight: 700; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .compare > div { border: 1px solid #e3e3e3; border-radius: 14px; padding: 16px; }
  .compare > div:last-child { border-color: #111; }
  .compare p { margin: 0; font-size: 15px; color: #444; }
  .note { font-size: 15px; color: #666; border-right: 3px solid #ddd; padding-right: 12px; }
  .steps, .checklist { padding-right: 22px; margin: 0 0 14px; }
  .steps li, .checklist li { margin-bottom: 12px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0 18px; }
  .card { border: 1px solid #e3e3e3; border-radius: 14px; padding: 14px; }
  .card b { font-family: ui-monospace, Menlo, monospace; font-size: 13px; direction: ltr; display: block; text-align: right; }
  .card p { margin: 6px 0 0; font-size: 14px; color: #555; line-height: 1.55; }
  table { width: 100%; border-collapse: collapse; margin: 14px 0 18px; font-size: 16px; }
  th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid #ececec; }
  th { font-size: 14px; color: #777; font-weight: 500; }
  .homework { background: #111; color: #fff; border-radius: 18px; padding: 28px 24px; margin-top: 36px; }
  .homework a { color: #fff; }
  .homework code { background: #2a2a2a; color: #fff; }
  .homework .note { color: #bbb; border-color: #444; }
  @media (max-width: 600px) {
    .compare, .cards { grid-template-columns: 1fr; }
    .arrow { transform: rotate(-90deg); }
  }
  .sub { font-size: 18px; margin: 26px 0 8px; }
  .video { display: flex; gap: 14px; align-items: center; border: 1px solid #e3e3e3; border-radius: 14px;
           padding: 10px; margin: 6px 0 18px; text-decoration: none; color: #111; }
  .video:hover { border-color: #111; }
  .video img { border-radius: 8px; flex-shrink: 0; width: 160px; height: auto; }
  .video span { display: flex; flex-direction: column; gap: 4px; }
  .video small { color: #666; font-size: 14px; }
  @media (max-width: 600px) { .video { flex-direction: column; align-items: stretch; } .video img { width: 100%; } }
  .plan { border: 1px solid #111; border-radius: 14px; padding: 16px 18px; margin: 8px 0 14px; }
  .plan b { font-size: 18px; }
  .plan p { margin: 4px 0 0; color: #444; }
  .time { font-size: 18px; font-weight: 700; background: #fff; color: #111; display: inline-block;
          padding: 6px 14px; border-radius: 10px; margin-bottom: 18px; }
  .sign { padding: 40px 0 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .sign p { font-size: 20px; margin: 0; }
  .stamp { display: flex; align-items: center; gap: 10px; border: 1.5px solid #111; border-radius: 14px;
           padding: 8px 14px; transform: rotate(-2deg); }
  .stamp img { border-radius: 50%; }
  .stamp span { display: flex; flex-direction: column; line-height: 1.2; }
  .stamp small { color: #666; font-size: 13px; }
  .try { border: 1px solid #111; border-radius: 16px; padding: 20px; margin-top: 22px; }
  .try h3 { font-size: 18px; margin-bottom: 8px; }
  .dl { font: inherit; font-weight: 700; background: #111; color: #fff; border: 0; border-radius: 999px;
        padding: 11px 22px; cursor: pointer; margin: 4px 0 16px; }
  .skill-dl { background: #f7f7f5; border: 0; border-radius: 18px; padding: 28px 24px; margin-top: 36px; }
  .skill-dl .dl { font-size: 18px; padding: 14px 28px; }
  html { scroll-behavior: smooth; }
  .muted { color: #777; font-size: 15px; }
  .brain { margin: 10px 0 18px; }
  .brain svg { width: 100%; height: auto; display: block; overflow: visible; }
  .brain .arm { stroke: #cfcfcf; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
  .brain .pulse { fill: #D97757; }
  .brain .pulse.back { fill: #111; opacity: .55; }
  .brain .halo { fill: #D97757; opacity: .12; transform-box: fill-box; transform-origin: center; animation: breathe 3s ease-in-out infinite; }
  .brain .burst { fill: #D97757; animation: spin 40s linear infinite; }
  .brain .hub { font: 800 19px "Heebo", system-ui, sans-serif; fill: #111; text-anchor: middle;
                paint-order: stroke; stroke: #f7f7f5; stroke-width: 8px; }
  .brain .node rect { fill: #fff; stroke: #dcdcdc; stroke-width: 1.5; }
  .brain .node text { font: 700 20px "Heebo", system-ui, sans-serif; fill: #111; text-anchor: middle; }
  .brain .node { transform-box: fill-box; transform-origin: center; animation: bob 4s ease-in-out infinite; }
  .brain figcaption { text-align: center; color: #666; font-size: 15px; margin-top: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .12; } 50% { transform: scale(1.18); opacity: .2; } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @media (prefers-reduced-motion: reduce) { .brain * { animation: none !important; } .brain .pulse { display: none; } }
  @media (max-width: 600px) {
    .brain { margin: 14px -22px 6px; }
    .brain .node text { font-size: 25px; } .brain .hub { font-size: 25px; }
    .desktop-only { display: none; }
  }
  /* password gate */
  .gate { min-height: 80vh; display: grid; place-items: center; text-align: center; }
  .gate form { display: flex; flex-direction: column; gap: 12px; width: min(320px, 100%); }
  .gate input { font: inherit; padding: 12px 14px; border: 1px solid #ccc; border-radius: 12px; text-align: center; }
  .gate button { font: inherit; font-weight: 700; padding: 12px; border: 0; border-radius: 999px; background: #111; color: #fff; cursor: pointer; }
  .gate .err { color: #b00020; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
<main id="app">
  <div class="gate">
    <form id="f">
      <h1 style="font-size:26px;margin:0">חוברת הדרכה</h1>
      <input id="p" type="password" placeholder="סיסמה" autocomplete="current-password" autofocus>
      <button type="submit">כניסה</button>
      <div class="err" id="e"></div>
    </form>
  </div>
</main>

  // Download buttons inside the decrypted content: data-download names a hidden
  // textarea that holds the file's text.
  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest("[data-download]");
    if (!btn) return;
    const text = document.getElementById(btn.dataset.download).value;
    const url = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: btn.dataset.filename });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  const bytes = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
  document.getElementById("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const err = document.getElementById("e");
    err.textContent = "";
    try {
      const pw = new TextEncoder().encode(document.getElementById("p").value.trim());
      const base = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveKey"]);
      let raw = null;
      for (const slot of SLOTS) {
        const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(slot.salt), iterations: ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        try { raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(slot.iv) }, kek, bytes(slot.key)); break; } catch {}
      }
      if (!raw) throw new Error("bad password");
      const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
      document.getElementById("app").innerHTML = new TextDecoder().decode(plain);
      window.scrollTo(0, 0);
    } catch {
      err.textContent = "סיסמה שגויה";
    }
  });
